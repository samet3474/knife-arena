# Render.com "Blueprint": depo bağlandığında ücretsiz Docker sunucusunu otomatik kurar.
services:
  - type: web
    name: knife-arena-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      # Oyun içindeki "Yönetici" girişinin şifresi. Render rastgele üretir;
      # Dashboard > knife-arena-server > Environment sayfasında görülür/değiştirilir.
      - key: ADMIN_PASSWORD
        generateValue: true
